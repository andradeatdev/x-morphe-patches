name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Read version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build patches
        run: ./gradlew :patches:buildAndroid -Pversion=${{ steps.version.outputs.version }} --no-daemon

      - name: Generate patch list
        run: ./gradlew :patches:generatePatchesList -Pversion=${{ steps.version.outputs.version }} --no-daemon

      - name: Update metadata and README
        run: |
          VER="${{ steps.version.outputs.version }}"
          REPO="${{ github.repository }}"
          # Ensure the patches-list version always matches the release tag.
          jq --arg v "$VER" '.version=$v' patches-list.json > tmp && mv tmp patches-list.json
          # Write the bundle metadata the Morphe Manager expects.
          jq -n \
            --arg v "$VER" \
            --arg dl "https://github.com/${REPO}/releases/download/${GITHUB_REF_NAME}/patches-${VER}.mpp" \
            --arg ca "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version:$v, created_at:$ca, description:"", download_url:$dl, signature_download_url:""}' \
            > patches-bundle.json
          # Update the patches section of the README.
          python3 .github/scripts/generate_patches_readme.py "$REPO" "$GITHUB_REF_NAME" patches-list.json README.md

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches-list.json patches-bundle.json README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: update release metadata for ${GITHUB_REF_NAME} [skip ci]"
            git push
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "X Patches for Morphe ${{ github.ref_name }}"
          files: patches/build/libs/patches-*.mpp